services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: airocx-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: JWT_SECRET
        value: airocx-super-secret-key-2025
      - key: ADMIN_PASSWORD
        value: AIROCXIP06

  # 2. Vite React Frontend Static Service
  - type: static
    name: airocx-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: "dist"