services:
  - type: web
    name: airocx-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airocx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: ENVIRONMENT
        value: "production"
      - key: PYTHON_VERSION
        value: "3.12.8"
    healthCheckPath: /api/health

databases:
  - name: airocx-db
    plan: free
    databaseName: airocx
    user: airocx
