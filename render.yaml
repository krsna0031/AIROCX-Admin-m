services:
  # ═══════════════════════════════════════════════
  # 1. Python FastAPI Backend (Render Web Service)
  # ═══════════════════════════════════════════════
  - type: web
    name: airocx-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./airocx.db"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "AIROCXIP06"
      - key: FRONTEND_URL
        value: "https://your-app.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.0"
    healthCheckPath: /api/health